<svg viewBox="0 0 140 145" xmlns="http://www.w3.org/2000/svg">
  <!-- Kanby mark. Fixed navy here, not currentColor: a favicon is drawn by the browser chrome, which
       supplies no colour and does not follow the app theme. -->
  <g transform="translate(10,10)" stroke="#0F2540" stroke-width="9" fill="#0F2540">
    <line x1="15"  y1="20"  x2="95"  y2="55"  stroke-linecap="round"/>
    <line x1="95"  y1="55"  x2="25"  y2="105" stroke-linecap="round"/>
    <line x1="25"  y1="105" x2="115" y2="115" stroke-linecap="round"/>
    <line x1="95"  y1="55"  x2="115" y2="115" stroke-linecap="round"/>
    <circle cx="15"  cy="20"  r="14"/>
    <circle cx="95"  cy="55"  r="18" fill="#F59E0B" stroke="#F59E0B"/>
    <circle cx="25"  cy="105" r="14"/>
    <circle cx="115" cy="115" r="14"/>
  </g>
</svg>
