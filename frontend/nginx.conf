server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cap uploads at the app limit (10 MB) + envelope; matches the API's RequestSizeLimit.
    client_max_body_size 12m;

    # SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy — same-origin, so no CORS needed.
    location /api/ {
        # Resolve `api` at request time via Docker's embedded DNS (127.0.0.11). Using a variable stops
        # nginx from caching the upstream IP at startup — otherwise a rebuilt api container gets a new IP
        # and every /api call 502s until nginx is restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
